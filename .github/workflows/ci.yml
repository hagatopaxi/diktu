name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Security advisories are published without any change here.
  schedule:
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev libglib2.0-dev-bin meson desktop-file-utils appstream gettext
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Schema, .desktop, metainfo
        run: meson setup _build && meson compile -C _build fr.gwenael_leger.Diktu.desktop fr.gwenael_leger.Diktu.metainfo.xml && meson test -C _build --no-rebuild --print-errorlogs

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
