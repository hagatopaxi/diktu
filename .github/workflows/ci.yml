name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libasound2-dev libglib2.0-dev-bin desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: glib-compile-schemas --strict --dry-run data
      - run: desktop-file-validate data/fr.gwenael_leger.Parlotte.desktop
      - run: appstreamcli validate --no-net data/fr.gwenael_leger.Parlotte.metainfo.xml
