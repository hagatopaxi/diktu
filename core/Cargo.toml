[package]
name = "diktu-core"
description = "Dictation pipeline: audio, streaming STT, text emission, model registry"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# Same version as the sherpa-onnx tag built in build-aux/fr.gwenael_leger.Diktu.json.
sherpa-onnx = { version = "1.13.8", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
serde_json = "1.0.151"
sha2 = "0.11.0"
reqwest = { version = "0.13.5", features = ["blocking"] }
cpal = "0.17.3"
rubato = "5.0.1"
ringbuf = "0.5.2"

[features]
# Links the shared libsherpa-onnx-c-api found in SHERPA_ONNX_LIB_DIR (Flatpak build from
# source); without it, sherpa-onnx-sys links its prebuilt static archive.
shared-sherpa = ["sherpa-onnx/shared"]

[dev-dependencies]
sha2 = "0.11.0"
