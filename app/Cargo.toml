[package]
name = "diktu"
description = "Local streaming voice dictation for GNOME"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
diktu-core = { path = "../core" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "remote_desktop", "screencast", "global_shortcuts", "background"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
futures-util = { version = "0.3", default-features = false }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "wav"] }
ksni = { version = "0.3.6", default-features = false, features = ["tokio"] }

[features]
# Development build, installable next to the release (D26).
devel = []

[build-dependencies]
glib-build-tools = "0.22.8"
