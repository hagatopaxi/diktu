[graph]
all-features = true

[advisories]
# Unmaintained crates are reported but do not fail: they rarely have a drop-in replacement.
unmaintained = "workspace"

[licenses]
# Licenses compatible with GPL-3.0-or-later.
allow = [
    "GPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between workspace crates.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
